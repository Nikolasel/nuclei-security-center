<!doctype html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="supported-color-schemes" content="light">
  <title>{{.Title}}</title>
  <style>
    /* Additive-only: see digest.html for why this block is safe to strip. */
    @media (max-width: 620px) {
      .nsc-pad { padding-left: 20px !important; padding-right: 20px !important; }
    }
    @media (prefers-color-scheme: dark) {
      body { background-color: #0a0a0a !important; }
    }
  </style>
</head>
<body style="margin:0;padding:0;background-color:#fafafa;-webkit-text-size-adjust:100%;font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#fafafa;font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
    <tr>
      <td align="center" style="padding:24px 12px;font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:600px;background-color:#ffffff;border:1px solid #e5e5e5;border-radius:8px;font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">

          <tr>{{template "brand" .}}</tr>

          <tr>
            <td class="nsc-pad" style="padding:24px 32px;font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
              <h1 style="margin:0;font-size:20px;font-weight:600;letter-spacing:-0.01em;color:#171717;">{{.Title}}</h1>
              {{if .Policy}}<p style="margin:6px 0 0;font-size:13px;color:#737373;">Policy: {{.Policy}}</p>{{end}}
            </td>
          </tr>

          <tr>
            <td class="nsc-pad" style="padding:0 32px 20px;font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
                <tr>
                  <td style="background-color:#fef2f2;border-left:3px solid #dc2626;border-radius:0 6px 6px 0;padding:12px 14px;font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
                    <div style="font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:#b91c1c;">Reason</div>
                    <div style="margin-top:4px;font-size:13px;line-height:1.5;color:#7f1d1d;white-space:pre-wrap;word-break:break-word;">{{.Reason}}</div>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <tr>
            <td class="nsc-pad" style="padding:0 32px 24px;font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="background-color:#4f46e5;border-radius:6px;">
                    <a href="{{.ScanURL}}" style="display:inline-block;padding:8px 14px;font-size:13px;font-weight:600;color:#ffffff;text-decoration:none;font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">Open scan</a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <tr>{{template "footer" .}}</tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
