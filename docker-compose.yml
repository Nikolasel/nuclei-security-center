name: nuclei-security-center

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nuclei
      POSTGRES_PASSWORD: nuclei
      POSTGRES_DB: nuclei
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nuclei"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Staged for Phase 3 (raw scan-output archival). Not yet used by any code.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  scanner:
    build:
      context: .
      dockerfile: deploy/Dockerfile.scanner
    environment:
      SCANNER_ADDR: ":8081"
      SCANNER_TOKEN: "${SCANNER_TOKEN:-dev-scanner-token-change-me}"
    ports:
      - "8081:8081"

  backend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    environment:
      BACKEND_ADDR: ":8080"
      DATABASE_URL: "postgres://nuclei:nuclei@postgres:5432/nuclei?sslmode=disable"
      SCANNER_URL: "http://scanner:8081"
      SCANNER_TOKEN: "${SCANNER_TOKEN:-dev-scanner-token-change-me}"
    depends_on:
      postgres:
        condition: service_healthy
      scanner:
        condition: service_started
    ports:
      - "8080:8080"

volumes:
  pgdata:
  miniodata:
