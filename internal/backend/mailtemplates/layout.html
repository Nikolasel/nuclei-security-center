{{/*
Shared chrome for NSC notification mails. Embedded at build time and rendered
through html/template (see internal/backend/mailrender.go), so every dynamic
value below is contextually escaped — including hrefs. Styling is inline on
purpose: mail clients routinely strip or ignore <style> blocks, so the layout
must survive with nothing but these attributes.

Colors mirror the web app's light theme (docs/UI_STYLE_GUIDE.md): neutral
surfaces, indigo links/buttons, the severity ramp red→orange→amber→yellow→sky
and the slate-950/cyan brand bar from web/src/components/Brand.tsx.
*/}}

{{define "brand"}}
<td style="background-color:#020617;padding:18px 32px;border-radius:8px 8px 0 0;">
  <span style="font-size:11px;font-weight:700;letter-spacing:0.22em;text-transform:uppercase;color:#67e8f9;">Nuclei</span>
  <span style="display:block;margin-top:2px;font-size:14px;font-weight:600;letter-spacing:0.02em;color:#ffffff;">Security Center</span>
</td>
{{end}}

{{define "footer"}}
<td class="nsc-pad" style="padding:16px 32px;background-color:#fafafa;border-top:1px solid #e5e5e5;border-radius:0 0 8px 8px;">
  <div style="font-size:12px;color:#737373;">
    Scan <span style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;">{{.ScanID}}</span>{{if .Policy}} · Policy {{.Policy}}{{end}}
  </div>
  <div style="margin-top:6px;font-size:12px;line-height:1.5;color:#737373;">
    Links open in Nuclei Security Center — you'll need to sign in as usual. No presigned URLs.
  </div>
</td>
{{end}}
