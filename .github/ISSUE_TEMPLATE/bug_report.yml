name: Bug report
description: Something is broken or behaves unexpectedly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a detailed report!
        **Found a security vulnerability? Do not open an issue here** —
        report it privately via SECURITY.md (GitHub private vulnerability reporting).
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: What happened vs. what you expected?
      placeholder: A clear and concise description.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Run scan with policy '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: App version or commit SHA (see the Settings page or the image tag you deployed).
      placeholder: v0.4.2-beta
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Deployment shape (docker compose / k8s / bare), browser, scanner-node details, relevant config (sanitized — no tokens or hostnames you don't own).
      placeholder: |
        backend v0.4.2-beta, single scanner node (docker compose), PostgreSQL 16, MinIO, Chrome.
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Backend/node log lines (slog JSON). Sanitize first — remove tokens, session values, and target data.
      render: shell
