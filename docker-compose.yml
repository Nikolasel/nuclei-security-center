name: nuclei-security-center

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nuclei
      POSTGRES_PASSWORD: nuclei
      POSTGRES_DB: nuclei
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nuclei"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage for raw scan-output archival (Phase 3). The
  # backend creates the bucket on startup; console is at localhost:9001.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  # Local OIDC identity provider. Seeded with realm "nsc": a confidential client
  # for the backend BFF, groups admin/operator/viewer, and one demo user each
  # (admin/operator/viewer, password = username). Browser reaches it at
  # localhost:8082; the backend reaches it in-network at keycloak:8080.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: "http://localhost:8082"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_PORT: "8080"
    ports:
      - "8082:8080"
    volumes:
      - ./deploy/keycloak/realm-nsc.json:/opt/keycloak/data/import/realm-nsc.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /realms/nsc HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"realm\"'"]
      interval: 5s
      timeout: 5s
      retries: 30

  scanner:
    build:
      context: .
      dockerfile: deploy/Dockerfile.scanner
    environment:
      SCANNER_ADDR: ":8081"
      SCANNER_TOKEN: "${SCANNER_TOKEN:-dev-scanner-token-change-me-0123456789ab}"
    ports:
      - "8081:8081"

  backend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    environment:
      BACKEND_ADDR: ":8080"
      DATABASE_URL: "postgres://nuclei:nuclei@postgres:5432/nuclei?sslmode=disable"
      SCANNER_URL: "http://scanner:8081"
      SCANNER_TOKEN: "${SCANNER_TOKEN:-dev-scanner-token-change-me-0123456789ab}"
      # OIDC/BFF auth. Browser-facing issuer (localhost:8082) differs from the
      # in-network discovery URL (keycloak:8080); see OIDC_DISCOVERY_URL.
      APP_BASE_URL: "http://localhost:8080"
      OIDC_ISSUER: "http://localhost:8082/realms/nsc"
      OIDC_DISCOVERY_URL: "http://keycloak:8080/realms/nsc"
      OIDC_CLIENT_ID: "nuclei-backend"
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET:-dev-oidc-secret-change-me}"
      # This local stack serves plaintext http://localhost:8080, so the session
      # cookie must not be Secure (browsers withhold Secure cookies over HTTP).
      # Secure defaults to true; keep TLS deployments on the default.
      COOKIE_SECURE: "false"
      # S3-compatible object storage for raw scan-output archival. The backend
      # creates the bucket on startup (retrying until MinIO is ready).
      S3_ENDPOINT: "minio:9000"
      S3_BUCKET: "nuclei-raw"
      S3_ACCESS_KEY_ID: "minio"
      S3_SECRET_ACCESS_KEY: "minio12345"
      S3_USE_SSL: "false"
      # Persist the nuclei-templates clone cache on a named volume so a restart
      # re-fetches deltas instead of re-cloning ~1 GB of .git every `up`. Set
      # TEMPLATE_SYNC_REPO="" to disable the sync entirely in a slim dev stack.
      TEMPLATE_SYNC_DIR: "/var/lib/nsc/template-sync"
    volumes:
      - templatecache:/var/lib/nsc
    depends_on:
      postgres:
        condition: service_healthy
      scanner:
        condition: service_started
      keycloak:
        condition: service_healthy
      minio:
        condition: service_started
    ports:
      - "8080:8080"

volumes:
  pgdata:
  miniodata:
  templatecache:
