name: Release

# Cut a release by pushing a semver tag, e.g.:
#   git tag v0.4.0 && git push origin v0.4.0
# This builds and pushes the backend and scanner container images to GHCR.
# Packages are created private by default (repo is public, images are not) —
# leave them private unless you deliberately publish them in package settings.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Pinned nuclei version baked into the scanner image. Bump here (and in
# deploy/Dockerfile.scanner's default) to upgrade nuclei; see docs/CONFIGURATION.md.
env:
  NUCLEI_VERSION: "3.11.0"

jobs:
  # Gate the release on a green test run so a tag can never ship untested code.
  test:
    name: Go test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...

  images:
    name: Build & push ${{ matrix.name }} image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: backend
            dockerfile: deploy/Dockerfile.backend
            build-args: ""
          - name: scanner
            dockerfile: deploy/Dockerfile.scanner
            build-args: |
              NUCLEI_VERSION=${{ env.NUCLEI_VERSION }}
    steps:
      - uses: actions/checkout@v7

      # QEMU covers any target-arch execution during the build. The Go/SPA/nuclei
      # stages are pinned to BUILDPLATFORM (no emulation), but keep this so the
      # arm64 leg still works if a future stage adds a target-arch RUN.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action lowercases the image name (GHCR requires lowercase) and
      # derives tags from the pushed git tag: full version, major.minor, and sha.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          build-args: ${{ matrix.build-args }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
